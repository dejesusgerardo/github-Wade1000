<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Estilos locales del proyecto -->
    <link rel="stylesheet" href="fonts/icomoon/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <title>Registro del Sistema</title>

    <style>
      :root {
        --color-primario: #d96b43;      /* Terracota cálido */
        --color-primario-hover: #be552e;/* Terracota oscuro */
        --color-secundario: #e8a87c;    /* Ámbar suave */
        --color-fondo: #fcf8f2;         /* Crema de fondo */
        --color-texto: #4a3e3d;         /* Café oscuro suave */
      }

      /* Flexbox en el body para centrado absoluto */
      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: 'Poppins', sans-serif;
        color: var(--color-texto);
        /* Imagen de fondo compartida */
        background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('images/mi_fondo.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        /* Centrado vertical y horizontal */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Tarjeta de Login centralizada */
      .login-card {
        background: rgba(252, 248, 242, 0.96);
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        width: 100%;
        max-width: 450px;
      }

      .login-card h3 {
        color: var(--color-primario);
        font-weight: 600;
      }

      .form-control {
        border-color: #ebdcd0;
        background-color: #fffaf5;
        color: var(--color-texto);
      }

      .form-control:focus {
        border-color: var(--color-primario);
        box-shadow: 0 0 0 0.2rem rgba(217, 107, 67, 0.25);
        background-color: #ffffff;
      }

      .btn-primary {
        background-color: var(--color-primario);
        border-color: var(--color-primario);
        transition: all 0.3s ease;
      }

      .btn-primary:hover, .btn-primary:focus {
        background-color: var(--color-primario-hover) !important;
        border-color: var(--color-primario-hover) !important;
        box-shadow: 0 4px 12px rgba(190, 85, 46, 0.3);
      }

      a.forgot-pass {
        color: var(--color-primario);
      }

      a.forgot-pass:hover {
        color: var(--color-primario-hover);
      }

      .control input:checked ~ .control__indicator {
        background-color: var(--color-primario);
      }
    </style>
  </head>
  <body>

  <!-- Recuadro de entrada de datos en el centro -->
  <div class="login-card mx-3">
    <h3 class="text-center">Registra tu Correo</h3>
    <p class="mb-4 text-center">Tu sistema de Acceso a este invento que está haciendo Gerardo.</p>
    
    <!-- Formulario controlado 100% por JavaScript -->
    <form onsubmit="procesarLogin(event)">
      <div class="form-group first mb-3">
        <label for="username">Correo Electrónico</label>
        <input type="email" class="form-control" placeholder="your-email@gmail.com" id="username" required>
      </div>
      <div class="form-group last mb-3">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" placeholder="Tu Contraseña" id="password" required>
      </div>
      
      <div class="d-flex mb-4 align-items-center">
        <label class="control control--checkbox mb-0">
          <span class="caption">Recordarme</span>
          <input type="checkbox" id="rememberMe" checked="checked"/>
          <div class="control__indicator"></div>
        </label>
        <span class="ml-auto"><a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a></span> 
      </div>

      <input type="submit" value="Log In" class="btn btn-block btn-primary py-2 font-weight-bold">
    </form>
  </div>

    <!-- Scripts de la plantilla -->
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <!-- JavaScript para guardar y redirigir -->
    <script>
    function procesarLogin(event) {
      // Cancela el envío de formulario tradicional para no buscar un backend/PHP
      event.preventDefault();

      const email = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      const usuario = {
        email: email,
        password: pass,
        fecha: new Date().toLocaleString()
      };

      // Guardar usuario en sesión activa
      localStorage.setItem('usuario_activo', JSON.stringify(usuario));

      // Guardar en el historial de registros dentro del navegador
      let registrosLocales = JSON.parse(localStorage.getItem('registros_usuarios')) || [];
      registrosLocales.push(usuario);
      localStorage.setItem('registros_usuarios', JSON.stringify(registrosLocales));

      // Redirigir directamente al menú
      window.location.href = 'menu.html';
    }
    </script>
  </body>
</html>
