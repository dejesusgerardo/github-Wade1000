<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Tradición | Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">🍽️ Sabor & Tradición</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="reservas.html">Reservas</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">Reserva tu Mesa Online</h2>
          <!-- Formulario validado con JavaScript -->
          <form id="contactForm">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Detalles de Reserva (Fecha, Hora, N° de Personas)</label>
              <textarea class="form-control" id="mensaje" rows="4" placeholder="Ej: Reserva para 4 personas el día viernes a las 8:00 PM" required></textarea>
            </div>
            <button type="submit" class="btn btn-gold w-100">Confirmar Reserva</button>
          </form>
          <div id="responseMessage" class="d-none"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 bg-custom-dark text-white mt-5">
    <p class="mb-0">&copy; 2026 Restaurante Sabor & Tradición.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
