<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Tradición | Especialidades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">🍽️ Sabor & Tradición</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="especialidades.html">Especialidades</a></li>
            <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section class="text-center mb-5">
      <h1 class="display-4 font-bold">Especialidades del Chef</h1>
      <p class="lead text-muted">Creaciones exclusivas diseñadas para paladares exigentes.</p>
    </section>

    <section class="row g-4">
      <div class="col-md-6">
        <article class="card h-100 dish-card shadow-sm" 
                 data-name="Paella Marinera Gourmet" 
                 data-description="Arroz a la langosta con camarones, langostinos, calamares y azafrán importado." 
                 data-price="$45.00" 
                 data-image="https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=500">
          <img src="https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=500" class="card-img-top" alt="Paella">
          <div class="card-body">
            <h5 class="card-title">Paella Marinera Gourmet</h5>
            <p class="card-text text-muted">Haz clic para ver detalles.</p>
            <span class="badge bg-danger fs-6">$45.00</span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <div class="modal fade" id="dishDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalDishTitle">Detalle</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalDishImg" src="" class="img-fluid rounded mb-3" alt="Especialidad">
          <p id="modalDishDesc" class="lead"></p>
          <h4 id="modalDishPrice" class="text-danger fw-bold"></h4>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 bg-custom-dark text-white mt-5">
    <p class="mb-0">&copy; 2026 Restaurante Sabor & Tradición.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
