<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore | Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TechStore</a>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
            <li class="nav-item"><a href="contacto.html" class="nav-link active">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4">Formulario de Contacto</h2>
          
          <form id="contactForm" novalidate>
            <div class="mb-3">
              <label for="fullName" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="fullName" placeholder="Ingresa tu nombre">
              <div class="invalid-feedback" id="nameFeedback">
                El nombre debe tener al menos 3 caracteres.
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
              <div class="invalid-feedback" id="emailFeedback">
                Por favor, ingresa un correo electrónico válido.
              </div>
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Mensaje</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
              <div class="invalid-feedback" id="messageFeedback">
                El mensaje debe contener al menos 10 caracteres.
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
          </form>

          <div id="formSuccess" class="alert alert-success mt-3 d-none" role="alert">
            ¡Gracias por contactarnos! Tu mensaje ha sido enviado correctamente.
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2026 TechStore Inc.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
